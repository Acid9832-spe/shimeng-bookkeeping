<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>石梦记账 · AI 记账</title>
  <style>
    :root{--ink:#312e46;--muted:#858196;--paper:#f9f7fc;--card:rgba(255,255,255,.78);--line:rgba(145,129,173,.16);--green:#4e9a83;--mint:#e8f5ef;--orange:#be7c93;--red:#c85b72;--shadow:0 18px 45px rgba(77,55,106,.09)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 5% 8%,#eee7ff 0,transparent 31%),radial-gradient(circle at 96% 20%,#dff4ed 0,transparent 27%),linear-gradient(130deg,#fbf9fe,#f6fbf8);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
    .shell{max-width:1120px;margin:auto;padding:34px 22px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;gap:12px;align-items:center}.logo{width:45px;height:45px;border-radius:17px;background:linear-gradient(145deg,#7160a9,#9b86c2);box-shadow:0 8px 18px rgba(106,87,158,.25);color:#fff;display:grid;place-items:center;font-size:20px;font-family:serif}.brand h1{font-size:22px;margin:0;letter-spacing:.1em;font-family:serif}.brand p{color:var(--muted);font-size:12px;margin:1px 0 0}.today{font-size:13px;color:var(--muted)}
    .hero{background:linear-gradient(120deg,#61518d,#8374ae 57%,#779f9a);color:white;border-radius:28px;padding:30px 31px;box-shadow:0 20px 42px rgba(83,66,126,.2);margin-bottom:22px;position:relative;overflow:hidden}.hero:after{content:'✦  ·  ✧';position:absolute;right:30px;top:20px;font-size:32px;letter-spacing:8px;color:#fff;opacity:.21}.hero h2{font-size:23px;margin:0 0 6px;font-family:serif;letter-spacing:.06em}.hero p{margin:0 0 18px;opacity:.84}.input-row{display:flex;gap:10px;position:relative}.input-row input{border:1px solid rgba(255,255,255,.33);min-width:0;flex:1;padding:15px 16px;border-radius:15px;font:inherit;outline:none;background:rgba(255,255,255,.94);color:var(--ink)}.input-row button{border:0;border-radius:15px;padding:0 21px;background:#f4eefa;color:#584779;font-weight:700;font:inherit;cursor:pointer;box-shadow:0 4px 12px rgba(44,29,76,.13)}.hint{font-size:12px;opacity:.72;margin:12px 2px 0}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.metric,.panel{background:var(--card);backdrop-filter:blur(13px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.metric{padding:18px}.metric span{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}.metric strong{font-size:25px;letter-spacing:-.04em}.income strong{color:var(--green)}.expense strong{color:var(--orange)}
    .grid{display:grid;grid-template-columns:1.08fr .92fr;gap:18px}.panel{padding:21px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.panel h3{font-size:16px;margin:0}.panel small{color:var(--muted)}.tabs{display:flex;gap:5px;background:#f3f5f0;border-radius:10px;padding:3px}.tabs button{border:0;background:transparent;color:var(--muted);padding:5px 9px;border-radius:7px;font:12px inherit;cursor:pointer}.tabs button.active{background:white;color:var(--ink);box-shadow:0 1px 3px #dfe5dc}
    .list{display:flex;flex-direction:column}.entry{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:0}.emoji{width:38px;height:38px;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-size:18px}.entry-title{font-weight:600}.entry-meta{font-size:12px;color:var(--muted);margin-top:2px}.amount{font-weight:700}.amount.in{color:var(--green)}.amount.out{color:var(--orange)}.delete{border:0;background:none;color:#aeb8b0;cursor:pointer;font-size:17px;padding:3px 0 3px 8px}
    .bar-row{margin:14px 0}.bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}.track{height:9px;background:#eeeaf3;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#82b9a5,#619c8b)}.chart{height:166px;display:flex;align-items:flex-end;gap:9px;padding:14px 4px 1px;border-bottom:1px solid var(--line)}.bar{flex:1;min-width:16px;background:#dcd5eb;border-radius:8px 8px 2px 2px;position:relative}.bar.active{background:linear-gradient(#937dba,#705b9d)}.bar i{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-style:normal;color:var(--muted);font-size:11px}.empty{text-align:center;color:var(--muted);padding:31px 10px}.empty b{display:block;font-size:30px;margin-bottom:5px}.foot{margin:20px 0 0;text-align:right}.foot button{border:0;background:none;color:var(--muted);font:12px inherit;cursor:pointer}
    @media(max-width:720px){.shell{padding:20px 15px}.top{margin-bottom:20px}.today{display:none}.hero{padding:22px 18px;border-radius:19px}.input-row button{padding:0 15px}.metrics{gap:8px}.metric{padding:14px 11px}.metric strong{font-size:19px}.grid{grid-template-columns:1fr}.panel{padding:18px}.brand h1{font-size:19px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="logo">石</div><div><h1>石梦记账</h1><p>让生活的每一笔，落成温柔的诗</p></div></div><div class="today" id="today"></div></header>
    <section class="hero"><h2>今天，有什么小小的花费？</h2><p>轻轻说一句，石梦会替你记下每一份生活。</p><div class="input-row"><input id="aiInput" placeholder="例如：午饭吃了 32 元，和同事喝咖啡 18" aria-label="自然语言记账"><button id="addBtn">记下这一笔</button></div><div class="hint">试试「工资到账 8500」「打车 26」「买菜花了 68」</div></section>
    <section class="metrics"><article class="metric income"><span>本月收入</span><strong id="income">¥0.00</strong></article><article class="metric expense"><span>本月支出</span><strong id="expense">¥0.00</strong></article><article class="metric"><span>本月结余</span><strong id="balance">¥0.00</strong></article></section>
    <section class="grid"><article class="panel"><div class="panel-head"><h3>最近记录</h3><small id="count">0 笔</small></div><div id="list" class="list"></div></article><article class="panel"><div class="panel-head"><h3>消费分析</h3><div class="tabs"><button class="active">本月</button></div></div><div id="categories"></div><div class="chart" id="chart" aria-label="近七日支出图"></div></article></section>
    <div class="foot"><button id="clearBtn">清空本地账本</button></div>
  </main>
  <script>
    const key='xiaozhangben-v1';
    let records=JSON.parse(localStorage.getItem(key)||'[]');
    const cats=[['餐饮',['吃','饭','餐','咖啡','奶茶','外卖','菜','水果'],'🍜'],['交通',['打车','地铁','公交','车费','停车','加油'],'🚕'],['购物',['买','购物','衣','鞋','淘宝','京东'],'🛍️'],['居住',['房租','水电','物业','宽带'],'🏠'],['娱乐',['电影','游戏','旅行','演出','健身'],'🎮'],['收入',['工资','奖金','收入','到账','红包','报销','收款'],'💰']];
    const money=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    const dateText=d=>new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date(d));
    document.getElementById('today').textContent=dateText(Date.now());
    function classify(text){for(const [name,words,emoji] of cats)if(words.some(w=>text.includes(w)))return {name,emoji};return {name:'其他',emoji:'🧾'}}
    function parse(text){const matches=[...text.matchAll(/(?:¥|￥)?\s*(\d+(?:\.\d{1,2})?)\s*(?:元|块|rmb|RMB|￥|¥)?/g)]; if(!matches.length)return null; const amount=Number(matches[matches.length-1][1]);const c=classify(text);return {id:Date.now(),note:text.trim(),amount,type:c.name==='收入'?'income':'expense',category:c.name,emoji:c.emoji,date:new Date().toISOString()};}
    function render(){records.sort((a,b)=>new Date(b.date)-new Date(a.date));localStorage.setItem(key,JSON.stringify(records));const now=new Date();const month=records.filter(r=>{const d=new Date(r.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()});const income=month.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0),expense=month.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);document.getElementById('income').textContent=money(income);document.getElementById('expense').textContent=money(expense);document.getElementById('balance').textContent=money(income-expense);document.getElementById('count').textContent=records.length+' 笔';
      const list=document.getElementById('list');list.innerHTML=records.length?records.slice(0,8).map(r=>`<div class="entry"><div class="emoji">${r.emoji}</div><div><div class="entry-title">${escapeHtml(r.note)}</div><div class="entry-meta">${r.category} · ${dateText(r.date)}</div></div><div><span class="amount ${r.type==='income'?'in':'out'}">${r.type==='income'?'+':'-'}${money(r.amount)}</span><button class="delete" aria-label="删除" data-id="${r.id}">×</button></div></div>`).join(''):'<div class="empty"><b>🧾</b>还没有账目<br>从上面说一句开始吧</div>';
      const sum={};month.filter(r=>r.type==='expense').forEach(r=>sum[r.category]=(sum[r.category]||0)+r.amount);const max=Math.max(...Object.values(sum),1);document.getElementById('categories').innerHTML=Object.entries(sum).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([n,v])=>`<div class="bar-row"><div class="bar-label"><span>${n}</span><b>${money(v)}</b></div><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div></div>`).join('')||'<div class="empty"><b>📊</b>记一笔支出后<br>这里会看到消费趋势</div>';
      const days=[];for(let i=6;i>=0;i--){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d)}const vals=days.map(d=>records.filter(r=>r.type==='expense'&&new Date(r.date).toDateString()===d.toDateString()).reduce((s,r)=>s+r.amount,0));const vmax=Math.max(...vals,1);document.getElementById('chart').innerHTML=days.map((d,i)=>`<div class="bar ${i===6?'active':''}" style="height:${Math.max(vals[i]/vmax*125,4)}px" data-tooltip="${money(vals[i])}"><i>${d.getDate()}日</i></div>`).join('');
    }
    function escapeHtml(s){const e=document.createElement('div');e.textContent=s;return e.innerHTML}
    function add(){const input=document.getElementById('aiInput'),r=parse(input.value);if(!r){input.style.outline='2px solid #c94c4c';input.placeholder='没识别到金额，例如：午饭 32 元';setTimeout(()=>input.style.outline='',1300);return}records.unshift(r);input.value='';render()}
    document.getElementById('addBtn').onclick=add;document.getElementById('aiInput').addEventListener('keydown',e=>{if(e.key==='Enter')add()});document.getElementById('list').onclick=e=>{const b=e.target.closest('[data-id]');if(b){records=records.filter(r=>r.id!==Number(b.dataset.id));render()}};document.getElementById('clearBtn').onclick=()=>{if(confirm('确定清空所有本地账目吗？')){records=[];render()}};render();
  </script>
</body>
</html>
